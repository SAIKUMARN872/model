[project]
name = "modelnow-ai"
version = "0.1.0"
description = "ModelNow AI Runtime and Data Infrastructure"
requires-python = ">=3.11,<3.14"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.16,<2.0",
    "redis>=6.0,<7.0",
    "pgvector>=0.4,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
